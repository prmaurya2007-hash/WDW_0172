<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 2</title>
</head>
<body>

    <!-- Headings -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    <!-- Paragraph with text formatting -->
    <p>
        Text with <b>bold</b>, <i>italic</i>, <u>underline</u>, <mark>mark</mark>, H<sub>2</sub>O, x<sup>2</sup>
    </p>

    <!-- Paragraph with HTML special character entities -->
    <p>
        &copy; &reg; &trade; &lt;tag&gt; &amp; &euro; &#8377; &hearts;
    </p>

    <!-- Horizontal rule -->
    <hr>

    <!-- Line break example -->
    <p>
        Line one<br>
        Line two
    </p>

</body>
</html>
