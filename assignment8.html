<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 8: Hyperlinks and Images</title>
</head>
<body>

    <h1 id="top">Hyperlinks and Images Demonstration</h1>

    <!-- 1. External Link with target and title attributes -->
    <h2>1. External Link</h2>
    <p>
        Visit <a href="https://wikipedia.org" target="_blank" title="Go to Wikipedia">Wikipedia</a> 
        (opens in a new tab).
    </p>

    <!-- 2. Email Link with mailto and subject attributes -->
    <h2>2. Email Link</h2>
    <p>
        Have questions? <a href="mailto:example@://email.com">Send an Email</a>.
    </p>

    <!-- 3. Image with Attributes (src, alt, width, height, border/style) -->
    <h2>3. Image with Attributes</h2>
    <img src="sample-image.jpg" alt="Descriptive text for the image" width="300" height="200" title="Sample Image">

    <!-- 4. Image Link (Clickable Image) -->
    <h2>4. Image Link</h2>
    <p>Click the image below to visit Google:</p>
    <a href="https://google.com" target="_blank">
        <img src="logo.png" alt="Google Logo" width="150" height="50">
    </a>

    <!-- 5. Internal Link (Bookmark / Anchor Link) -->
    <h2>5. Internal Link</h2>
    <p>
        <a href="#top">Back to Top</a>
    </p>

</body>
</html>
